name: Layers

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # 分步定位：每层独立 job 并行，主门禁（CI/test）失败时快速定位是哪一层
  layer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: [host, qemu, serial, persist, net, socket, cc500]
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            nasm \
            qemu-system-x86 \
            socat

      # cc500 层脚本内部会自行构建（勿先 clean 再让它构建）
      - name: make test-${{ matrix.layer }}
        run: make test-${{ matrix.layer }}
        working-directory: v2-c-kernel

      - name: 失败上传该层日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.layer }}
          path: v2-c-kernel/build/*.log
