# ============================================================================
# 分支保护绑定清单（ops 侧单一事实源，2026-09-04 复核）——改 workflow 必先对照
# ----------------------------------------------------------------------------
# main 分支保护 required_status_checks：仅 context `test`（strict=True）。
#   - ⚠️ 绑定的是【裸名】`test`：会匹配【任何】workflow 里名为 test 的 job。
#   - ⚠️ 红线：任何 workflow 禁止生成名为 `test` 的 job（动态矩阵尤其注意），
#     否则会意外满足 required 门禁。
# 非 required（PR 阶段并行定位用）：
#   - ci.yml:        lint / regression-rr
#   - arena.yml:     selftest
#   - layers.yml:    load-layers / fast / layer(<层名>) 动态矩阵
# 规则（ops 专属职责，不下放 dev）：
#   1. job 名与 required 的绑定关系由 ops 独占管理；任何新增 job 若要 required，
#      由 ops 在分支保护里显式添加；
#   2. 改任何 workflow 的 job 名后，必须复查分支保护 required checks 并同步本清单。
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # 编译硬化门禁（P1）：危险 libc 调用检查——秒级，独立并行 job，最先红绿可见。
  # 不放 make test 前序，避免一条慢链把快门禁拖住。
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 危险 libc 门禁（banned libc）
        run: make lint
        working-directory: v2-c-kernel

  # 主门禁：job 名保持 test（main 分支保护 required check 绑定该名，勿改）
  test:
    # 固定 ubuntu-24.04 钉住 gcc 13.3，防 ubuntu-latest 滚版本导致告警集漂移（P1 编译硬化）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 工具链包集合单源：v2-c-kernel/Makefile 的 CI_RUNNER_PKGS（经 ci-pkgs 单行输出）。
      # 依赖构建/跑测试的 job 一律消费此清单，勿手抄包名（曾因 layers 缺 qemu-user 靠环境侥幸）。
      # lint 是纯静态 job 白名单例外，无需工具链。
      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y $(make -s -C v2-c-kernel ci-pkgs)

      # make test 聚合 = v2-c-kernel/Makefile 的 TEST_LAYERS（唯一事实源）；
      # 新增/减少层见 docs/README.md 维护规则，勿在此手抄层名清单。
      - name: 全链回归（TEST_LAYERS，失败即中断）
        run: make test
        working-directory: v2-c-kernel

      - name: 失败上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: v2-c-kernel/build/*.log

  # RR 处理项重型回归（F3/F6 修复落点）：独立 job，不绑定 main 分支保护的 required check `test`，
  # 避免拖慢/抖动强制门禁；但每次 push/PR 都会执行，红绿可见，用于把"修复过的测试 harness"接进 CI 回归。
  # - make test-repro   ：repro_bugs.sh（BUG-A/BUG-B 不复现 + F6 argv 生效硬断言）
  # - make test-tcp-attack：test_tcp_attack.sh（F3 端口占用→exit 2 环境病，不误杀）
  regression-rr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 工具链包集合单源：消费 Makefile ci-pkgs（含 qemu-user，见 CI_RUNNER_PKGS）。
      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y $(make -s -C v2-c-kernel ci-pkgs)

      - name: 录制/回放复现回归（BUG-A/BUG-B + argv 硬断言）
        run: make test-repro
        working-directory: v2-c-kernel

      - name: 虚拟 TCP 压力/攻击回归（端口占用=环境病 exit 2）
        run: make test-tcp-attack
        working-directory: v2-c-kernel

      # BUG-052 稳定性回归（K1 串口原子化 + 判据加固的显性回归）：test-tr 连跑 TR_STA_RUNS=3 次 0 假红。
      # 挂在非 required 的 regression-rr（不绑定 main 门禁）；慢（3×QEMU 冷启），故不并入 make test。
      - name: RR 判据稳定性回归（test-tr ×3 零假红）
        run: make test-tr-stable TR_STA_RUNS=3
        working-directory: v2-c-kernel

      - name: 失败上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-rr-logs
          path: v2-c-kernel/build/*.log
