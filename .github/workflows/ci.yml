name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # 主门禁：job 名保持 test（main 分支保护 required check 绑定该名，勿改）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            nasm \
            qemu-system-x86 \
            socat

      # Makefile 的 test: 依赖链已含全 9 层（host/qemu/serial/persist/net/socket/cc500/slip/tcp）
      - name: 全链回归（9 层，失败即中断）
        run: make test
        working-directory: v2-c-kernel

      - name: 失败上传构建日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: v2-c-kernel/build/*.log
